name: Documentation

# Builds the API documentation of the library at the commit pinned in `lakefile.toml` and publishes
# it to GitHub Pages. The repository's Pages source must be GitHub Actions, and the `github-pages`
# environment must allow deployments from this branch.

on:
  push:
    branches: [docs]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a run still in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # In a private copy of the repository, where hosted runners are billed, run only when started
    # by hand.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      # As on `main`: the build needs more disk than a hosted runner has free.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Documenting a module loads everything it imports, up to 6 GB for one that imports most of
      # Mathlib, and Lake documents as many modules at once as there are cores, so give the runner
      # as much swap again as its 16 GB of memory. Lake starts each process by forking itself, and
      # the kernel refuses a fork as "not enough memory" by how much memory it counts as committed,
      # well over 100 GB while a few GB are in use; let it overcommit instead.
      - name: Add memory
        run: |
          sudo sysctl -w vm.overcommit_memory=1
          sudo swapoff -a
          sudo fallocate -l 16G /swapfile-docs
          sudo chmod 600 /swapfile-docs
          sudo mkswap /swapfile-docs
          sudo swapon /swapfile-docs
          free -h

      - uses: actions/checkout@v7

      # Installs Lean, fetches the dependencies and Mathlib's cache.
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false

      # The library's build depends only on the pinned commit, so it is kept between runs.
      - uses: actions/cache/restore@v6
        id: library-cache
        with:
          path: .lake/packages/axqm/.lake/build
          key: library-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # Built on its own first, so that compiling it and documenting Mathlib do not compete for
      # memory.
      - name: Build the library
        run: lake build ToMathlib AxQM

      - if: ${{ steps.library-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .lake/packages/axqm/.lake/build
          key: ${{ steps.library-cache.outputs.cache-primary-key }}

      # Documenting Lean core and Mathlib is most of the work, and changes only when Mathlib or the
      # toolchain does, so it is kept between runs, also from a run that fails part way, which the
      # next run continues. Lake rebuilds whatever is out of date; a module whose file is unchanged
      # keeps its source link to the commit it was first documented at, which shows the same file.
      - uses: actions/cache/restore@v6
        with:
          path: .lake/build
          key: docs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: docs-

      # Documents `ToMathlib`, `AxQM` and everything they import.
      - name: Build the documentation
        run: lake build @axqm:docs

      - if: ${{ always() }}
        uses: actions/cache/save@v6
        with:
          path: .lake/build
          key: docs-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Add the home page and the index of items
        run: |
          rev=$(jq -r '.packages[] | select(.name == "axqm") | .rev' lake-manifest.json)
          python3 pages.py .lake/build/doc "${{ github.server_url }}/${{ github.repository }}/blob/$rev"

      - name: Disk usage
        if: ${{ always() }}
        run: |
          df -h /
          du -sh .lake/build/doc || true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .lake/build/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
